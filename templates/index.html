<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Gateway - Login</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-dark: #3a5985;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: A1.6;
            background-color: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            overflow: hidden;
        }

        .login-header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .login-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.2);
        }

        .btn {
            display: inline-block;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            width: 100%;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .error-message {
            color: var(--danger);
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--secondary);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid var(--primary);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>ESP32 SMS Gateway</h1>
        </div>
        <div class="login-body">
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div id="error-message" class="error-message"></div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Authenticating...</p>
            </div>
            <div class="footer">
                <p>Developer-Oriented Smart SMS Gateway</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            const token = localStorage.getItem('sms_gateway_token');
            if (token) {
                // Redirect to dashboard
                window.location.href = 'dashboard';
            }

            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const loading = document.getElementById('loading');

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                // Hide any previous error message
                errorMessage.style.display = 'none';
                // Show loading spinner
                loading.style.display = 'block';

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Call the authentication API
                fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Authentication failed');
                    }
                    return response.json();
                })
                .then(data => {
                    // Store token and user info in localStorage
                    localStorage.setItem('sms_gateway_token', data.token);
                    localStorage.setItem('sms_gateway_api_key', data.api_key);
                    localStorage.setItem('sms_gateway_username', data.username);
                    localStorage.setItem('sms_gateway_role', data.role);

                    // Redirect to dashboard
                    window.location.href = 'dashboard';
                })
                .catch(error => {
                    // Hide loading spinner
                    loading.style.display = 'none';
                    // Show error message
                    errorMessage.textContent = 'Invalid username or password. Please try again.';
                    errorMessage.style.display = 'block';
                    console.error('Error:', error);
                });
            });
        });
    </script>
</body>
</html>
